<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="sans-serif" font-size="12">
<rect class="bg" x="0" y="0" width="600" height="400" fill="#ffffff"/>
<text x="60" y="24" font-size="15" font-weight="bold">Delivery time, 20-minute bins</text>
<line x1="60" x2="580" y1="340.00" y2="340.00" stroke="#e5e5e5"/>
<text class="ytick" x="54" y="344.00" text-anchor="end">0</text>
<line x1="60" x2="580" y1="280.00" y2="280.00" stroke="#e5e5e5"/>
<text class="ytick" x="54" y="284.00" text-anchor="end">100</text>
<line x1="60" x2="580" y1="220.00" y2="220.00" stroke="#e5e5e5"/>
<text class="ytick" x="54" y="224.00" text-anchor="end">200</text>
<line x1="60" x2="580" y1="160.00" y2="160.00" stroke="#e5e5e5"/>
<text class="ytick" x="54" y="164.00" text-anchor="end">300</text>
<line x1="60" x2="580" y1="100.00" y2="100.00" stroke="#e5e5e5"/>
<text class="ytick" x="54" y="104.00" text-anchor="end">400</text>
<line x1="60" x2="580" y1="40.00" y2="40.00" stroke="#e5e5e5"/>
<text class="ytick" x="54" y="44.00" text-anchor="end">500</text>
<rect class="bar" x="60.00" y="248.80" width="130.00" height="91.20" fill="#4a7ab5" stroke="#ffffff"/>
<rect class="bar" x="190.00" y="74.80" width="130.00" height="265.20" fill="#4a7ab5" stroke="#ffffff"/>
<rect class="bar" x="320.00" y="140.80" width="130.00" height="199.20" fill="#4a7ab5" stroke="#ffffff"/>
<rect class="bar" x="450.00" y="339.40" width="130.00" height="0.60" fill="#4a7ab5" stroke="#ffffff"/>
<text class="xtick" x="60.00" y="356" text-anchor="middle">0</text>
<text class="xtick" x="190.00" y="356" text-anchor="middle">20</text>
<text class="xtick" x="320.00" y="356" text-anchor="middle">40</text>
<text class="xtick" x="450.00" y="356" text-anchor="middle">60</text>
<text class="xtick" x="580.00" y="356" text-anchor="middle">80</text>
<line class="axis" x1="60" x2="580" y1="340" y2="340" stroke="#333333"/>
<line class="axis" x1="60" x2="60" y1="40" y2="340" stroke="#333333"/>
<text x="320" y="388" text-anchor="middle">minutes</text>
<text x="14" y="190" transform="rotate(-90 14 190)" text-anchor="middle">deliveries</text>
</svg>
