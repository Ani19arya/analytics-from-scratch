name: course

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The course promises Python 3.9 or later. Hosted runners no longer ship
        # 3.9, so each version runs inside the official Python image.
        python: ["3.9", "3.12"]
    container: python:${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checkout (container user differs from the owner)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Python version
        run: python --version
      - name: Lesson tests (solutions pass, exercises fail)
        run: python tools/run_all_tests.py --exercise
      - name: Lint (style, curriculum, links)
        run: python tools/lint.py --strict
      - name: Generated docs are current
        run: python tools/build_docs.py --check
      - name: Tool tests (placement check)
        run: python -B -m unittest discover -s tools -p "test_*.py"
      - name: Every dataset rebuilds byte for byte
        run: |
          for f in phases/*/*/make_data.py; do (cd "$(dirname "$f")" && python make_data.py > /dev/null); done
          git status --short
          test -z "$(git status --porcelain)"

  visuals-browser:
    # Real browser tests of the pages in visuals/. The official Playwright image ships
    # Chromium for this exact version; the npm module is installed to match, without browsers.
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Playwright module (only if the image does not provide it)
        run: node -e "require('playwright')" 2>/dev/null || npm install --no-save --no-package-lock playwright@1.63.0
      - name: Browser tests of the visual explainers
        run: node tools/visuals_browser_test.mjs
