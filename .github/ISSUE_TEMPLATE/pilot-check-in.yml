name: Pilot check-in
description: A short weekly check-in for pilot learners. Every field except the lessons is optional.
title: "[pilot] check-in"
labels: ["pilot"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking part in the pilot. Share only what you are happy to share.

        **This issue is public: anything you write here is visible to everyone, and copies can outlive an edit.**
        If you prefer, send your export privately to the pilot organiser instead of pasting it here.

        To include your progress, run `python3 tools/progress.py export` from the repo root (the coarse level is the
        default). It shows exactly what it includes and asks before writing. It is pseudonymous, not anonymous: no
        name or contact details, but a random id and your activity pattern could still point to you in a small group.
        Do not paste a `--level full` export here. Please do not add names, emails or paths anywhere below.
  - type: textarea
    id: export
    attributes:
      label: Pseudonymous progress export (optional, coarse level recommended)
      description: Paste the JSON printed by python3 tools/progress.py export --yes (coarse), or leave blank.
      render: json
    validations:
      required: false
  - type: input
    id: lessons
    attributes:
      label: Lessons done this week
      description: Lesson ids, separated by commas. Write "none" if you did not get to any.
      placeholder: "00-01, 00-02, 01-01"
    validations:
      required: true
  - type: textarea
    id: hardest
    attributes:
      label: Hardest point this week
      description: The lesson and step where you slowed down most, and why, if you know.
    validations:
      required: false
  - type: dropdown
    id: clarity
    attributes:
      label: How clear were the lessons this week?
      description: 1 is very confusing, 5 is very clear.
      options:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
    validations:
      required: false
  - type: dropdown
    id: recommend
    attributes:
      label: Would you recommend the course to a friend who wants an analyst job?
      options:
        - "Yes"
        - "Maybe"
        - "No"
        - "Not sure yet"
    validations:
      required: false
